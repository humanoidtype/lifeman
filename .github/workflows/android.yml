name: Build Android APK

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
            LIFEMAN_APP_URL: ${{ vars.LIFEMAN_APP_URL }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  tools: composer:v2
                  coverage: none

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Install dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Add Android platform
              run: npx cap add android

            - name: Sync Capacitor
              run: npx cap sync android

            - name: Cache Gradle dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      gradle-

            - name: Bundle notification sounds
              run: mkdir -p android/app/src/main/res/raw && cp public/sounds/*.wav android/app/src/main/res/raw/

            - name: Build debug APK
              run: npm run apk:debug

            - name: Upload APK
              uses: actions/upload-artifact@v4
              with:
                  name: lifeman-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk